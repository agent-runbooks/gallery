name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Every runbook is consistent and carries a released engine
        run: |
          for dir in skills/*/; do
            echo "== $dir"
            (cd "$dir" && python flow.py --check)
            version=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" "$dir/agent_runbooks.py")
            test -n "$version"
            curl -fsSL "https://raw.githubusercontent.com/agent-runbooks/skills/refs/tags/agent-runbook-authoring/v$version/skills/agent-runbook-authoring/references/agent_runbooks.py" | cmp - "$dir/agent_runbooks.py"
          done
