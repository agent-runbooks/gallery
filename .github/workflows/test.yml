name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Every runbook is consistent and carries a released engine
        run: |
          for dir in skills/*/; do
            echo "== $dir"
            (cd "$dir" && python flow.py --check)
            version=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" "$dir/runbook.py")
            curl -fsSL "https://raw.githubusercontent.com/agent-runbooks/skills/refs/tags/agent-runbook-authoring/v$version/skills/agent-runbook-authoring/references/runbook.py" | cmp - "$dir/runbook.py"
          done
